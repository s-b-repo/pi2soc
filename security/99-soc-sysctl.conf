# Installed to /etc/sysctl.d/99-soc.conf — tune the VM for zram on a 1 GB Pi.
# Favour compressed swap over reclaim thrash; small page-cluster suits zram.
#
# NOTE: vm.swappiness values above 100 REQUIRE Linux >= 5.8 (commit that raised
# the cap from 100 to 200 to favour cheap zram swap). On kernels < 5.8 the value
# is silently CLAMPED to 100, which defeats the zram-first intent here. Pi OS
# Bookworm ships 6.x, so 180 applies as written. If you must run this on an older
# kernel, use a value in 0..100 (e.g. 100) instead — do not assume 180 took.
vm.swappiness = 180
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.page-cluster = 0
