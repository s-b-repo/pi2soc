# Installed to /etc/systemd/journald.conf.d/10-soc.conf  (PERF-2)
#
# A 24/7 self-healing kiosk logs a lot (every panel recycle, respawn, VPN
# reconnect, poll error). Left unbounded the journal grows to the systemd
# default (~4 GB / 10% of disk) and chews SD-card write endurance. Cap it, cap
# per-file size, and batch fsyncs to spare the flash — while still keeping logs
# across a reboot for post-incident forensics (a SOC box wants its history).
[Journal]
Storage=persistent
SystemMaxUse=100M
SystemMaxFileSize=10M
RuntimeMaxUse=50M
SyncIntervalSec=5m
MaxRetentionSec=2week
